jobs:
    -
        kernel_include_regex: (.*transpose*)
        kernel_iteration_range: "[1, [3-4]]"
        output_file: out
        output_directory: opt_transpose_profile_att_activity_perfcounter_ctrl_new
        output_format: [pftrace]
        truncate_kernels: true
        sys_trace: true # enable for pftrace and otf2
        advanced_thread_trace: true # enable for att and ui folder
        #att_activity: "10" # 8, 10 (explore, debug)
        att_perfcounter_ctrl: "32" #[1,32]
        att_perfcounters: "SQ_INSTS_MFMA, SQ_VALU_MFMA_BUSY_CYCLES, SQ_LDS_BANK_CONFLICT, SQ_LDS_ADDR_CONFLICT, SQ_LDS_UNALIGNED_STALL, SQ_LDS_IDX_ACTIVE, SQ_ACTIVE_INST_LDS, SQ_INST_LEVEL_LDS"
        att_target_cu: 1
        att_shader_engine_mask: "0xf" # collect one CU from 4 SEs
        att_simd_select: "0xf" # collect 4 SIMDs on single CU
        att_buffer_size: "0x40000000"
    -
        pmc: [SQ_WAVES, FETCH_SIZE]
